name: Upload required-check report
description: Retains one exact-subject leaf report for fail-closed closure.
inputs:
  artifact-name:
    description: Unique report artifact name
    required: true
  path:
    description: Exact report path
    required: true
runs:
  using: composite
  steps:
    - name: Upload exact report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

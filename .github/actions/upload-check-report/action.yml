name: Upload required-check report
description: Retains one exact-subject leaf report for fail-closed closure.
inputs:
  artifact-name:
    description: Unique report artifact name
    required: true
  path:
    description: Exact report path
    required: true
runs:
  using: composite
  steps:
    - name: Upload exact report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

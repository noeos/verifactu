name: Defect report
description: Report a reproducible non-security defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must use private reporting. Never include real fiscal data or secrets.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal deterministic reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no secrets, personal data, tax records or customer payloads.
          required: true

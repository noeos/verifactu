version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:47"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: disabled

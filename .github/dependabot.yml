version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:47"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

name: Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * 1"

permissions: {}

concurrency:
  group: conformance-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CI: "true"
  SOURCE_DATE_EPOCH: "0"
  TZ: UTC
  VERIFACTU_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  regulatory:
    name: Conformance · regulatory sources and generated contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.VERIFACTU_SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-engineering
        with:
          node-version: 24.21.0
          npm-version: 11.19.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.15
          check-latest: false
      - name: Admit exact Maven provider inputs
        run: node tooling/ci/setup-java-provider.mjs
      - name: Install hash-locked SPDX validation runtime
        shell: bash
        run: python -m pip install --require-hashes --no-deps --disable-pip-version-check -r config/python/requirements.lock
      - run: node tooling/tasks/run-task.mjs --task gate:p3
        shell: bash
      - run: node tooling/ci/write-auxiliary-report.mjs --context 'Conformance · regulatory sources and generated contracts' --job-id regulatory --output ci-reports/regulatory.json --task-report evidence/runs/gate--p3.json
        shell: bash
      - uses: ./.github/actions/upload-check-report
        with:
          artifact-name: auxiliary-conformance-regulatory
          path: ci-reports/regulatory.json
  consumers:
    name: Conformance · packed consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.VERIFACTU_SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-engineering
        with:
          node-version: 24.21.0
          npm-version: 11.19.1
      - run: node tooling/tasks/run-task.mjs --task integration:tarball-consumers
        shell: bash
      - run: node tooling/ci/write-auxiliary-report.mjs --context 'Conformance · packed consumers' --job-id consumers --output ci-reports/consumers.json --task-report evidence/runs/integration--tarball-consumers.json
        shell: bash
      - uses: ./.github/actions/upload-check-report
        with:
          artifact-name: auxiliary-conformance-consumers
          path: ci-reports/consumers.json

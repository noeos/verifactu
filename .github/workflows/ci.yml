name: Engineering CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CI: "true"
  SOURCE_DATE_EPOCH: "0"
  TZ: UTC
  VERIFACTU_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  engineering:
    name: Engineering CI · gate:p2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.VERIFACTU_SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up engineering toolchain
        uses: ./.github/actions/setup-engineering
        with:
          node-version: 24.21.0
          npm-version: 11.19.1
      - name: Set up hash-locked validation runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.15
          check-latest: false
      - name: Install hash-locked SPDX runtime
        shell: bash
        run: python -m pip install --require-hashes --no-deps --disable-pip-version-check -r config/python/requirements.lock
      - name: Run canonical P2 gate
        env:
          VERIFACTU_PYTHON: python3
        shell: bash
        run: node tooling/tasks/run-task.mjs --task gate:p2
      - name: Write evidence report
        shell: bash
        run: node tooling/ci/write-auxiliary-report.mjs --context 'Engineering CI · gate:p2' --job-id engineering --output ci-reports/engineering.json --task-report evidence/runs/gate--p2.json
      - name: Retain evidence artifact
        uses: ./.github/actions/upload-check-report
        with:
          artifact-name: auxiliary-ci-engineering
          path: ci-reports/engineering.json

name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Required · governance signatures and DCO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Check out the exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise policy-negative fixtures
        run: python3 .github/scripts/check-commit-policy.py --self-test
      - name: Verify the exact commit range
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_EVENT: ${{ github.event_name }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_REF: ${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
        run: >-
          python3 .github/scripts/check-commit-policy.py
          --event "$POLICY_EVENT"
          --base "$POLICY_BASE_SHA"
          --head "$POLICY_HEAD_SHA"
          --ref "$POLICY_REF"
          --repository "$GITHUB_REPOSITORY"

  documentation-policy:
    name: Required · documentation and traceability
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise governance-negative fixtures
        run: |
          python3 .github/scripts/check-governance.py --self-test
          python3 .github/scripts/audit-github.py --self-test
      - name: Validate documentation and governance policy
        run: python3 .github/scripts/check-governance.py

  required-check-closure:
    name: Required · required-check closure
    if: ${{ always() }}
    needs:
      - commit-policy
      - documentation-policy
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Reject incomplete or failed prerequisites
        env:
          COMMIT_POLICY_RESULT: ${{ needs.commit-policy.result }}
          DOCUMENTATION_POLICY_RESULT: ${{ needs.documentation-policy.result }}
        run: |
          test "$COMMIT_POLICY_RESULT" = success
          test "$DOCUMENTATION_POLICY_RESULT" = success

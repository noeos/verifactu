name: Release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v1.0.0
        type: string

permissions: { contents: read }
concurrency:
  group: noeos-release-verification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify tag ancestry and signature
        run: |
          set -euo pipefail
          git config gpg.ssh.allowedSignersFile security/allowed-signers
          git verify-tag "$RELEASE_TAG"
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Verify toolchain and local evidence
        run: node scripts/check-toolchain.mjs --profile node-24-primary && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- ci --ignore-scripts --omit=optional && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run policy:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run regulatory:check

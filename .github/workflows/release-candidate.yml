name: Non-publishing release candidate rehearsal

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-candidate-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    name: Rehearsal · unsigned and non-publishable candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main
      - name: Set up the admitted primary Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Set up the admitted Python reference runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: 3.13.15
      - name: Install locked tooling without optional or lifecycle code
        run: |
          npm ci --ignore-scripts --omit=optional
          python -m pip install --require-hashes --only-binary=:all: -r config/toolchain/requirements-spdx.lock
      - name: Execute the complete non-publishing rehearsal
        env:
          VERIFACTU_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: node tooling/tasks/run-task.mjs --task gate:p2 --evidence-dir evidence/runs/release-candidate
      - name: Retain exact P2 artifacts and task reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: p2-non-publishing-rehearsal-${{ github.sha }}
          path: |
            .cache/packages/*.tgz
            .cache/supply-chain/*.json
            evidence/runs/release-candidate/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

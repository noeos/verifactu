name: Release candidate rehearsal

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: "true"
  SOURCE_DATE_EPOCH: "0"
  TZ: UTC
  VERIFACTU_SUBJECT_SHA: ${{ github.sha }}

jobs:
  rehearsal:
    name: Release candidate · non-publishing rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-engineering
        with:
          node-version: 24.21.0
          npm-version: 11.19.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.15
          check-latest: false
      - name: Admit exact Maven provider inputs
        run: node tooling/ci/setup-java-provider.mjs
      - name: Install hash-locked SPDX runtime
        shell: bash
        run: python -m pip install --require-hashes --no-deps --disable-pip-version-check -r config/python/requirements.lock
      - name: Run non-publishing P2 rehearsal
        shell: bash
        run: |
          node tooling/tasks/run-task.mjs --task gate:p2
          node tooling/ci/write-auxiliary-report.mjs --context 'Release candidate · non-publishing rehearsal' --job-id rehearsal --output ci-reports/rehearsal.json --task-report evidence/runs/gate--p2.json
      - uses: ./.github/actions/upload-check-report
        with:
          artifact-name: auxiliary-release-candidate
          path: ci-reports/rehearsal.json

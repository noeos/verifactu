name: Regulatory source observation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * 1"

permissions: {}

concurrency:
  group: regulatory-observation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  observe:
    name: Regulatory observation · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Observe with platform TLS (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./tooling/regulatory/observe-official-sources.ps1
      - name: Observe with platform TLS (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: bash tooling/regulatory/observe-official-sources.sh
      - name: Upload bounded quarantine
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regulatory-observation-${{ matrix.os }}
          path: ci-evidence/regulatory-observation
          if-no-files-found: error
          retention-days: 7

name: GitHub effective-state audit

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-effective-state-audit
  cancel-in-progress: false

jobs:
  readback:
    name: Audit · read-only effective GitHub state
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: read
    timeout-minutes: 20
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main
      - name: Exercise audit-negative fixtures
        run: python3 .github/scripts/audit-github.py --self-test
      - name: Read back effective repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/audit-github.py --subject-sha "$GITHUB_SHA" --output evidence/tmp/github-effective-state.json
      - name: Retain the redacted bounded report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: github-effective-state-${{ github.run_id }}
          path: evidence/tmp/github-effective-state.json
          if-no-files-found: error
          retention-days: 14

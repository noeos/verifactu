name: GitHub audit authority guard

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-effective-state-audit
  cancel-in-progress: false

jobs:
  authority-boundary:
    name: Audit · collector and token authority boundary
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: read
    timeout-minutes: 20
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main
      - name: Exercise audit-negative fixtures
        run: python3 .github/scripts/audit-github.py --self-test
      - name: Prove the ephemeral token cannot claim administrative read-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/audit-github.py --actions-token-boundary --output evidence/tmp/github-token-boundary.json
      - name: Retain the bounded authority report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: github-token-boundary-${{ github.run_id }}
          path: evidence/tmp/github-token-boundary.json
          if-no-files-found: error
          retention-days: 14

name: OpenSSF Scorecard

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: openssf-scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    name: Assurance · OpenSSF Scorecard signal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - name: Analyze repository posture without publishing a badge claim
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload SARIF to repository security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: scorecard.sarif
      - name: Retain the bounded Scorecard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: scorecard-${{ github.run_id }}
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 14
